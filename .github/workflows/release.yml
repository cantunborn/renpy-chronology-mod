name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version string for the zip filename (e.g. v1.2)"
        required: true
      game:
        description: "Game name (e.g. imperial-chronicles) — leave blank for base mod release"
        required: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Build and release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ github.event.inputs.version }}"
          GAME_INPUT="${{ github.event.inputs.game }}"

          # Determine list of targets: "all" expands to base + every non-sample game
          if [ "$GAME_INPUT" = "all" ]; then
            TARGETS="$(ls game-chapters/*.json | xargs -I{} basename {} .json | grep -v sample)"
            TARGETS="$TARGETS sample"
          else
            TARGETS="${GAME_INPUT:-sample}"
          fi

          convert_readme() {
            python3 - README.md "$1" <<'PYEOF'
          import sys, re
          src, dst = sys.argv[1], sys.argv[2]
          text = open(src, encoding="utf-8").read()
          text = re.sub(r'<details>.*?</details>', '', text, flags=re.DOTALL).strip()
          lines = text.splitlines()
          out = []
          for line in lines:
              if re.match(r'^# ', line):
                  t = line[2:].strip(); out += [t.upper(), "=" * len(t)]
              elif re.match(r'^## ', line):
                  t = line[3:].strip(); out += ["", t.upper(), "-" * len(t)]
              elif re.match(r'^### ', line):
                  out += ["", line[4:].strip()]
              elif re.match(r'^---+$', line.strip()):
                  pass
              elif re.match(r'^```', line.strip()):
                  pass
              elif re.match(r'^\|[-| :]+\|$', line.strip()):
                  pass
              elif line.strip().startswith("|") and line.strip().endswith("|"):
                  cells = [c.strip() for c in line.strip().strip("|").split("|")]
                  cells = [re.sub(r'\*\*(.+?)\*\*', r'\1', c) for c in cells]
                  cells = [re.sub(r'\*(.+?)\*',     r'\1', c) for c in cells]
                  cells = [re.sub(r'`(.+?)`',        r'\1', c) for c in cells]
                  cells = [re.sub(r'\[(.+?)\]\(.+?\)', r'\1', c) for c in cells]
                  out.append("  ".join(f"{c:<20}" for c in cells).rstrip())
              else:
                  line = re.sub(r'\*\*(.+?)\*\*', r'\1', line)
                  line = re.sub(r'\*(.+?)\*',     r'\1', line)
                  line = re.sub(r'`(.+?)`',        r'\1', line)
                  line = re.sub(r'\[(.+?)\]\(.+?\)', r'\1', line)
                  out.append(line)
          open(dst, "w", encoding="utf-8").write("\n".join(out).strip() + "\n")
          PYEOF
          }

          for GAME in $TARGETS; do
            echo "→ Building target: $GAME"
            MOD_DIR="staging/game/renpy-chronology-mod"
            rm -rf staging
            mkdir -p "$MOD_DIR"

            cp timeline_init.rpy \
               timeline_hooks.rpy \
               timeline_screen.rpy \
               timeline_save_hooks.rpy \
               timeline_tests.rpy \
               "$MOD_DIR/"
            cp -r fonts "$MOD_DIR/fonts"
            cp -r backend "$MOD_DIR/backend"
            cp -r ui "$MOD_DIR/ui"

            if [ ! -f "game-chapters/${GAME}.json" ]; then
              echo "ERROR: game-chapters/${GAME}.json not found"; exit 1
            fi
            cp "game-chapters/${GAME}.json" "$MOD_DIR/chapters.json"

            convert_readme "$MOD_DIR/README.txt"

            if [ "$GAME" = "sample" ]; then
              ZIP_NAME="chronology-mod-${VERSION}.zip"
              TAG="stable"
              TITLE="Chronology Mod - Stable Release"
            else
              ZIP_NAME="chronology-mod-${VERSION}-${GAME}.zip"
              TAG="stable-${GAME}"
              TITLE="Chronology Mod - $(echo "$GAME" | sed 's/-/ /g' | sed 's/\b\(.\)/\u\1/g')"
            fi

            (cd staging && zip -r "../${ZIP_NAME}" game/ -x "*.DS_Store")
            echo "→ Created ${ZIP_NAME}"

            gh release delete "$TAG" --repo "${{ github.repository }}" --yes 2>/dev/null || true
            gh release create "$TAG" "$ZIP_NAME" \
              --repo "${{ github.repository }}" \
              --title "$TITLE" \
              --generate-notes
            echo "→ Released ${TAG}"
          done
